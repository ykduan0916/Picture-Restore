[project]
name = "picture-renew-backend"
version = "0.1.0"
description = "Picture Renew - 电商商品图与营销素材制作后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "alembic>=1.14.0,<1.15.0",
    "asyncpg>=0.30.0,<0.31.0",  # PostgreSQL 异步驱动
    "langgraph>=0.2.62,<0.3.0",
    "langchain-core>=0.3.28,<0.4.0",
    "arq>=0.26.1,<0.27.0",
    "redis>=5.2.1,<6.0.0",
    "pillow>=11.0.0,<12.0.0",
    "boto3>=1.35.84,<2.0.0",  # S3 兼容存储
    "python-multipart>=0.0.20,<0.1.0",  # 文件上传
    "httpx>=0.28.1,<0.29.0",  # 异步 HTTP 客户端
    "psycopg2-binary>=2.9.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.9.1,<0.10.0",  # 代码检查与格式化
    "mypy>=1.14.1,<2.0.0",  # 类型检查
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (由 formatter 处理)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
